  <style>
    html {
      box-sizing: border-box;
    }

    *,
    *:before,
    *:after {
      box-sizing: inherit;
    }

    html,
    body {
      height: 100%;
    }

    /* <- classic, stable */
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: "Noto Sans", sans-serif;
    }

    details {
      border: 1px solid #333;
      margin-bottom: 10px;
      border-radius: 10px;
    }

    details>summary {
      padding: 2px 6px;
      border: none;
      cursor: pointer;
    }

    blockquote {
      margin-block-start: 10px;
      margin-block-end: 10px;
      margin-inline-start: 5px;
      padding-inline-start: 5px;
    }

    blockquote.idea {
      border-left: 5px solid #FAE496;
    }

    blockquote.suitcase {
      border-left: 5px solid #8A6041;
    }

    img {
      max-width: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    /* No forced sizes on a-scene/canvas. Let AR.js/A-Frame own layout. */

    #instruction {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 0 0 5px black;
      z-index: 20;
      pointer-events: none;
    }

    /* Popup card */
    .liquid-glass-card {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 95%;
      height: 85%;
      background: #fff;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0px 10px 30px rgba(255, 255, 255, 0.25);
      display: none;
      flex-direction: column;
      will-change: transform, opacity;
      backface-visibility: hidden;
      z-index: 1000;
    }

    .card-content {
      width: 100%;
      padding: 0 10px;
      color: #000;
      overflow-y: auto;
      flex-grow: 1;
    }

    .divider {
      border-top: 1px solid #333;
      width: 100%;
      margin: 30px 0 25px 0;
    }

    .card-content h2 {
      font-size: 24px;
      text-align: center;
      margin: 16px 0;
    }

    .card-buttons {
      position: sticky;
      top: 0;
      height: 56px;
      /* fixed bar height */
      padding: 0 8px;
      display: block;
      /* we'll absolutely position the buttons */
    }

    .card-buttons .back-btn,
    .card-buttons .close-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      line-height: 36px;
      text-align: center;
      border-radius: 6px;
    }

    /* back: left; close: right */
    .back-btn {
      left: 8px;
    }

    .close-btn {
      right: 8px;
    }

    .back-btn {
      display: none;
    }

    .close-btn,
    .back-btn {
      cursor: pointer;
      font-size: 40px;
      font-weight: bold;
      color: #333;
      width: 36px;
      height: 36px;
      line-height: 36px;
      text-align: center;
      border-radius: 6px;
      user-select: none;
    }

    .chapter-link {
      display: block;
      padding: 12px 10px;
      margin: 8px 0;
      border-radius: 12px;
      background: #f5f5f5;
      color: #111;
      text-decoration: none;
      font-weight: 600;
    }

    .chapter-link:active {
      transform: translateY(1px);
    }

    .btn-container {
      text-align: center;
    }

    /* CSS */
    .btn {
      display: inline-block;
      background-color: #FFFFFF;
      border: 0;
      border-radius: .5rem;
      box-sizing: border-box;
      color: #111827;
      font-size: .875rem;
      font-weight: 600;
      line-height: 1.25rem;
      padding: .75rem 1rem;
      text-align: center;
      text-decoration: none #D1D5DB solid;
      text-decoration-thickness: auto;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .btn:hover {
      background-color: rgb(249, 250, 251);
    }

    .btn:focus {
      outline: 2px solid transparent;
      outline-offset: 2px;
    }

    .btn:focus-visible {
      box-shadow: none;
    }

    /* Tap ripple overlay */
    #tapfx {
      position: fixed;
      inset: 0;
      pointer-events: none;
      /* never block taps */
      z-index: 40;
    }

    .ripple {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      border: 2px solid var(--ripple-color, #4CAF50);
      opacity: 0.95;
      transform: translate(-50%, -50%) scale(0.3);
      animation: ripple-out 520ms ease-out forwards;
    }

    .pano {
      width: 100%;
      height: 300px;
      border: none;
      border-radius: 10px;
      overflow: hidden;
    }

    .ripple.miss {
      --ripple-color: #F44336;
    }

    .ripple.hit {
      --ripple-color: #4CAF50;
    }

    @keyframes ripple-out {
      0% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(0.3);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(3.2);
      }
    }

    .chapter {
      margin: 15px 0;
    }

    .chapter h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <div id="instruction">Tap a pin to learn more</div>

  <div id="popup" class="liquid-glass-card" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <div class="card-buttons">
      <div class="back-btn" id="backBtn" aria-label="Back">&larr;</div>
      <div class="close-btn" id="closeBtn" aria-label="Close">×</div>

      <div id="popup-body"></div>
    </div>
  </div>

  <div id="tapfx" aria-hidden="true"></div>

  <!-- AR scene (let AR.js fully control sizing/projection) -->
  <a-scene embedded vr-mode-ui="enabled: false" renderer="logarithmicDepthBuffer: true"
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;" id="sceneRoot">

    <a-assets>
      <a-asset-item id="pin" src="models/pin/scene.gltf"></a-asset-item>

    <a-entity camera>
      <a-entity cursor="fuse: false; rayOrigin: mouse;"
        raycaster="objects: .clickable; recursive: true; near: 0.001; far: 2000">
      </a-entity>
    </a-entity>
  </a-scene>

  <!-- iOS inline video kickstart -->
  <script>
    function kickstartARVideo() {
      const v = document.querySelector('#arjs-video, video[playsinline][autoplay]') || document.querySelector('video');
      if (!v) return;
      v.setAttribute('playsinline', 'true');
      v.setAttribute('webkit-playsinline', 'true');
      v.muted = true;
      v.autoplay = true;
      if (v.play) { try { v.play(); } catch (e) { } }
    }
    document.addEventListener('DOMContentLoaded', kickstartARVideo, { once: true });
    window.addEventListener('touchend', function once() {
      kickstartARVideo();
      window.removeEventListener('touchend', once);
    }, { passive: true, once: true });
  </script>

  <script>
    const CM_TO_AR_SCALE = 0.35;

    /* Content data */
    const copyright = "<div class=\"divider\"></div><p>Tutte le foto sono state scattate da Heinz Plenge e sono disponibili sotto la <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\" target=\"_blank\" ref=\"noopener\">Licenza Creative Commons CC BY-SA 4.0</a>.</p><p><strong>©Heinz Plenge</strong></p>";

    const popupData = [
      {
        id: 0,
        pattern: "data/letterA.patt",
        title: "Quando le montagne erano oceani",
        pin_title: "La nascita",
        pin_position: { x: -15 * CM_TO_AR_SCALE, y: 0, z: -10 * CM_TO_AR_SCALE },
        content: "<p>Immagina di tuffarti indietro nel tempo, 250 milioni di anni fa. Dove oggi si alza il Monte San Giorgio, c’era un mare caldo e luminoso, attraversato da rettili marini, pesci scintillanti e strane piante che ondeggiavano sul fondale. Strato dopo strato, quel mondo è rimasto impresso nella roccia come in un album fotografico della vita antica. Oggi, camminando tra i suoi sentieri, non calpestiamo solo pietre, ma i resti di un oceano scomparso: un tesoro geologico che ci svela come le montagne nascono dal mare e come la vita rinasce nel tempo.</p><h3>Seleziona i capitoli per approfondire</h3>",
        chapters: [
          {
            title: "a) 250–240 milioni di anni fa: un mare tropicale",
            content: "<p>Nel Triassico Medio, l’attuale Monte San Giorgio era una laguna tropicale poco profonda, protetta da una barriera corallina e collegata al grande oceano Tetide. L’acqua calma e poco ossigenata favoriva la fossilizzazione: quando animali e piante cadevano sul fondale, non venivano distrutti ma conservati in modo eccezionale.</p>"
          },
          {
            title: "b) Dalla laguna alle rocce fossilifere",
            content: "<p>Sedimenti di fango, sabbia e resti organici si accumularono per milioni di anni, trasformandosi in strati di roccia alternati tra bitume (scisti bituminosi) e calcari. Nei loro strati sono custoditi almeno sei livelli fossiliferi principali, una vera “cronaca naturale” di oltre 250 milioni di anni.</p><ul><li>Formazione di Besano (247–242 mio. anni fa): fossili di rettili marini come Mixosaurus e Tanystropheus</li><li>Calcare di Meride (242–236 mio. anni fa): ecosistemi più ricchi, con piante, insetti e nuovi rettili.</li></ul><blockquote class=\"idea\"><strong>💡 Curiosità</strong><br/>Formazione del marmo di Arzo, si è formato sul fondale di un antico oceano, laguna del Monte San Giorgio, i movimenti geologici interni al Monte San Giorgio hanno frantumato la roccia sedimentaria che si è ricristalizzata con altri minerali, dando origine a una breccia eterogenea straordinariamente colorata.</blockquote>"
          },
          {
            title: "c) Gli abitanti del mare triassico",
            content: "<p>Tra i fossili più celebri:</p><ul><li>Tanystropheus longobardicus: rettile marino lungo fino a 6 metri, con un collo sproporzionato che era tre volte più lungo del tronco.<img src=\"images/san-giorgio/rettile.jpg\" alt=\"rettile\"/></li><li>Mixosaurus: piccolo antenato degli ittiosauri, molto diffuso.<img src=\"images/san-giorgio/mixosaurus.jpg\" alt=\"mixosaurus\"/></li><li>Cymbospondylus: predatore gigante degli oceani.<img src=\"images/san-giorgio/cymbospondylus.jpg\" alt=\"cymbospondylus\"/></li><li>Pesci, ammoniti e conchiglie perfettamente conservati, usati dai paleontologi per datare gli strati: <blockquote>🧳 vedi il fossile di un ammonite stampato in 3D <strong>nella valigia</strong></blockquote></li></ul><blockquote class=\"idea\"><strong>💡 Curiosità</strong><br/>Nel Monte San Giorgio sono stati scoperti anche fossili con tracce di tessuti molli e organi interni, una rarità assoluta nella paleontologia.</blockquote>"
          },
          {
            title: "d) Dal mare alla montagna",
            content: "<p>Il processo di continua trasformazione ha dato vita alle montagne, che conosciamo oggi come le Alpi. Il Monte San Giorgio invece è la testimonianza di una collisione fra la placca africana e la placca europea che vicino alla trasformità solleva gli strati, fra cui i fondali marini con i suoi tesori fossiliferi.</p>"
          },
          {
            title: "e) Un patrimonio unico al mondo",
            content: "<p>Il Monte San Giorgio custodisce una sequenza stratigrafica continua di oltre dieci milioni di anni, un libro di pietra che racconta senza interruzioni la vita del Triassico. Nei suoi strati sono stati ritrovati più di 21 000 fossili, eccezionalmente conservati: non solo scheletri di animali marini, ma anche piante e insetti che permettono di ricostruire l’intero ecosistema. Questo tesoro, condiviso tra Svizzera e Italia, è valso al Monte San Giorgio il riconoscimento come Patrimonio UNESCO (2003 Svizzera, 2010 Italia), rendendolo uno dei siti paleontologici più importanti al mondo.</p><blockquote class=\"idea\"><strong>💡 Curiosità</strong><br/>Nel 2020 è stato descritto un nuovo rettile marino, il Besanosaurus leptorhynchus, scoperto proprio nel Monte San Giorgio e lungo oltre 8 metri.</blockquote>"
          }
        ],
        links: []
      },
      {
        id: 1,
        pattern: "data/letterB.patt",
        title: "Il Monte San Giorgio, una lunga storia della vita",
        pin_title: "Storia della vita",
        pin_position: { x: -10 * CM_TO_AR_SCALE, y: 0, z: -20 * CM_TO_AR_SCALE },
        content: "<p>Il Monte San Giorgio non è solo la montagna dei fossili triassici, ma anche un luogo che custodisce la memoria umana. Qui, natura e cultura si intrecciano: i luoghi riconosciuti come sacri sono diventati templi e santuari cristiani;  e le vie di transito sono rimaste sentieri di incontri. Ogni epoca ha inciso segni che ancora oggi raccontano la lunga storia della coevoluzione della vita del bosco e di quella umana.</p><h3>Seleziona i capitoli per approfondire</h3>",
        chapters: [
          {
            title: "a) Le grotte ventilate del Paleolitico",
            content: "<p>Molto prima che il Monte ospitasse un confine o villaggi, offriva come rifugio a piccoli gruppi di cacciatori-raccoglitori numerose grotte ventilate, dove l’aria circolava costantemente ed era possibile accendere un fuoco. Qui i primi abitanti della montagna lavoravano le pietre, raccoglievano piante medicinali e leggevano nel cielo il ritmo delle stagioni.</p><blockquote class=\"idea\"><strong>💡 Curiosità</strong><br/>Nel Monte San Giorgio vi sono 57 grotte ventilate.</blockquote><div class=\"btn-container\"><a class=\"btn\" href=\"https://www.flickr.com/photos/193857153@N03/albums/72177720323612886/with/54307721698\" target=\"_blank\" rel=\"noopener\">Foto delle grotte</a></div><blockquote class=\"idea\"><strong>💡 Curiosità</strong><br/>I resti del paleolitico sono stati scoperti soltanto nel 2023 da un’archeologo del Sudan in visita all’USI.</blockquote><div class=\"btn-container\"><a class=\"btn\" href=\"https://www.flickr.com/photos/193857153@N03/albums/72177720323612886/with/54307721698\" target=\"_blank\" rel=\"noopener\">Foto dei fossili</a></div>"
          },
          {
            title: "b) Dalle grotte ai villaggi.",
            content: "<p>Con il Neolitico, la montagna cambiò volto non più soltanto un luogo abitato, ma un paesaggio costruito. Le comunità umane iniziarono a costruire templi e altari per stabilire e mantenere una relazione con il cosmo (e per dare un senso alla loro vita). Iniziarono solo in seguito a coltivare il bosco, ad adomesticare gli animali e a costruire villaggi. Infatti, le tracce di ceramiche e utensili raccontano la quotidianità di comunità ormai stabili. Ma il Monte San Giorgio era innanzitutto  un luogo sacro, al confine tra il mondo della pianura e quello delle alpi. Sul monte comparvero altari per pratiche rituali e dedicati al culto degli antenati; le comunità umane dialogavano con il mistero della vita che le circondava.</p><div class=\"btn-container\"><a class=\"btn\" href=\"https://www.flickr.com/photos/193857153@N03/albums/72177720323611041/with/54307762740\" target=\"_blank\" rel=\"noopener\">Foto dei villaggi</a></div>"
          },
          {
            title: "c) I Celti e le prime testimonianze della scrittura in Ticino",
            content: "<p>In epoca celtica, il Monte divenne un punto di incontro fra popoli, merci e idee. Non a caso i celti hanno contribuito a unificare il linguaggio attraverso l’introduzione della scrittura e appare nelle stelle e nell’alfabeto di Lugano.</p><blockquote class=\"idea\"><strong>💡 Curiosità</strong><br/>Il dialetto parlato oggi in Ticino è la testimonianza viva dell’antico linguaggio celtico. Per es. Bioggio viene da “biöcc”, in celtico è “blogieos”, e molti altri.</blockquote>"
          },
          {
            title: "d) Pietre vive tra villaggi e castelli del Medioevo",
            content: "<p>La continuità del culto della montagna e all’acqua che genera viene mantenuta in epoca romana, soprattutto a Riva San Vitale e si consolida al principio della cristianità con la costruzione del battistero. Croci in pietra e piccole cappelle sorsero dove prima si erigevano altari ancestrali. Affreschi e simboli cristiani cominciarono a segnare il paesaggio, e la montagna si fece santuario, meta di devozione e di pellegrinaggi. Era una rivoluzione silenziosa e grandiosa che ridisegnava il senso stesso del rapporto tra l’uomo e questo luogo.</p><blockquote class=\"idea\"><strong>💡 Curiosità</strong><br/>Il battistero di Riva San Vitale (IV° secolo) è il monumento più antico della Svizzera.</blockquote><p>Guardalo a 360 gradi:</p><div class=\"pano\" data-src=\"images/san-giorgio/battistero-riva-360.jpg\"></div>"
          },
          {
            title: "e) Il Medioevo – villaggi e castelli",
            content: "<p>Nel Medioevo il paesaggio culturale del monte si arricchisce di nuovi monumenti, chiese e cappelle per il culto. Ma le grotte continuano a essere abitate dagli eremiti, in particolare da  Manfredo Settala, Santo guaritore ed esperto di piante medicinali della montagna. Il suo culto si estende per oltre mille anni e vive ancora oggi attraverso la festa del miracolo del pane e una devozione continua dell’intera comunità.</p><img src=\"images/san-giorgio/manfredo-settala.jpg\" alt=\"manfredo settala\"/>"
          }
        ],
        links: []
      },
      {
        id: 2,
        pattern: "data/letterC.patt",
        title: "Botanica",
        pin_title: "Botanica",
        pin_position: { x: 0 * CM_TO_AR_SCALE, y: 0, z: 0 * CM_TO_AR_SCALE },
        content: "<p>Il Monte San Giorgio non racconta solo storie di fossili e mari antichi, ma anche di piante che curano, nutrono e profumano il tempo presente. Qui la biodiversità è straordinaria: tra boschi, radure e pendii crescono specie rare e preziose, molte conosciute fin dall’antichità per le loro proprietà medicinali e alimentari.</p><p>In questa valigia troverai semi da piantare, simbolo di continuità e vita: un invito a portare un frammento di questa montagna nel tuo giardino.</p><h3>Seleziona i capitoli per approfondire</h3>",
        chapters: [
          {
            title: "a) L’orchidea gialla – il gioiello fragile del monte",
            content: "<p>Tra le gemme più delicate del Monte San Giorgio fiorisce l’orchidea gialla, una specie rara e protetta che in Svizzera cresce soltanto qui. I suoi petali luminosi sembrano riflettere la luce del sole sul calcare, ma la sua bellezza fragile ricorda quanto sia importante preservare la biodiversità di questo luogo unico. È un piccolo tesoro botanico che parla di equilibrio e rispetto per la natura.</p><img src=\"images/san-giorgio/orchidea-gialla.jpg\" alt=\"orchidea gialla\"/>"
          },
          {
            title: "b) L’equiseto – la pianta fossile che cura",
            content: "<p>L’Equisetum arvense, o equiseto, è una pianta antichissima, così antica da avere fossili esposti nel Museo del Monte San Giorgio. Cresceva già milioni di anni fa, quando la Terra era popolata dai rettili marini. Oggi la ritroviamo viva sulle pendici del monte, usata da secoli per le sue proprietà curative.</p><p>Ricca di silice, veniva impiegata per favorire la guarigione delle ferite e purificare i reni. Persino Plinio il Vecchio, nella sua Naturalis Historia, ne elogiava gli effetti diuretici e cicatrizzanti. Una pianta che unisce passato e presente, fossile e vita.</p><blockquote class=\"idea\"><strong>💡 Curiosità</strong><br/>I sauri del Monte San Giorgio si trovano in associazione con l’equiseto, presenti nei boschi come parte della vegetazione che potevano consumare a scopo alimentare e terapeutico.</blockquote>"
          },
          {
            title: "c) Il tiglio – l’albero della calma",
            content: "<p>Sulle strade ombreggiate del Monte San Giorgio, il tiglio diffonde il suo profumo dolce e rassicurante. Da sempre simbolo di pace e protezione, i suoi fiori vengono usati per preparare infusi calmanti e sedativi, ideali contro l’ansia, l’insonnia e i malanni di stagione.</p><p>In ogni tazza di tisana al tiglio c’è un frammento della saggezza delle erbe che da secoli accompagna la vita sul monte.</p>"
          },
          {
            title: "d) L’aglio orsino – forza e nutrimento della foresta",
            content: "<p>Nei boschi umidi e freschi cresce l’aglio orsino, una pianta selvatica dal profumo intenso e dal potere curativo. Usato come tonico naturale, era apprezzato per trattare problemi respiratori e digestivi.</p><p>Ma non era solo medicina: le sue foglie, raccolte in primavera, arricchivano i piatti contadini, portando l’energia della foresta sulla tavola. Oggi, come allora, l’aglio orsino racconta il legame profondo tra natura, salute e nutrimento.</p><blockquote class=\"suitcase\"><strong>🧳 All’interno della valigia</strong> si trovano i semi di aglio orsino, da raccogliere e piantare per poi usare le foglie fresche per insaporire i nostri piatti.</blockquote>"
          }
        ],
        links: []
      }
    ];

    // ===== Chapters ====
    // ---------- State ----------
    let currentItem = null;         // the active popup item
    let currentChapterIndex = null; // null = section view, number = chapter view

    // ---------- View helpers ----------
    const popupTitle = document.getElementById('popup-title');
    const popupBody = document.getElementById('popup-body');
    const backBtn = document.querySelector('.back-btn');
    const closeBtn = document.getElementById('closeBtn');

    backBtn.addEventListener('click', (e) => {
      e.preventDefault();
      goBackToSection();      // <-- go back to section, keep popup open
    });

    closeBtn.addEventListener('click', (e) => {
      e.preventDefault();
      hidePopup();            // <-- close popup
    });

    // Build the SECTION (overview) HTML
    function buildSectionHTML(item) {
      // Overview content + a list of chapter links
      const list = (item.chapters || []).map((ch, i) =>
        `<a href="#" class="chapter-link" data-ch="${i}">${ch.title}</a>`
      ).join('');
      return `${item.content}
            ${list ? `<div class="chapter-list">${list}</div>` : ''}${copyright}`;
    }

    // Build a CHAPTER page HTML
    function buildChapterHTML(item, idx) {
      const ch = item.chapters[idx];
      // Optional: prepend the chapter title as an <h3>
      return `<div class="chapter">
              <h3>${ch.title}</h3>
              ${ch.content}
            </div>`;
    }

    // Attach click handlers to chapter links after rendering a section page
    function bindChapterLinks(item) {
      popupBody.querySelectorAll('.chapter-link').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          const idx = parseInt(a.dataset.ch, 10);
          goToChapter(item, idx);
        }, { passive: false });
      });
    }

    // ---------- GSAP content swap ----------
    /**
     * Slide current content LEFT and bring new content FROM LEFT.
     * (If you ever want the opposite direction, just flip signs.)
     */
    function swapContentWithSlide(newHTML, afterInsert, dir = { out: 'left', in: 'right' }) {
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const durOut = reduced ? 0 : 0.25;
      const durIn = reduced ? 0 : 0.30;

      // Map direction to xPercent values
      const OUT_X = dir.out === 'right' ? 8 : -8;   // where the current view exits
      const IN_START = dir.in === 'left' ? -12 : 12; // where the new view starts

      // Slide OUT current
      return gsap.to(popupBody, {
        xPercent: OUT_X,
        opacity: 0,
        duration: durOut,
        ease: 'power2.out',
        onComplete: () => {
          popupBody.innerHTML = newHTML;
          popupBody.scrollTop = 0;
          popupBody.parentElement.scrollTop = 0;
          if (afterInsert) afterInsert();

          // Prepare IN state (from the chosen side)
          gsap.set(popupBody, { xPercent: IN_START, opacity: 0 });

          // Slide IN to center
          gsap.to(popupBody, {
            xPercent: 0,
            opacity: 1,
            duration: durIn,
            ease: 'power3.out'
          });
        }
      });
    }

    // ==== Navigation actions ====

    function goToChapter(item, idx) {
      currentChapterIndex = idx;
      const html = buildChapterHTML(item, idx);
      return swapContentWithSlide(html, () => {
        backBtn.style.display = 'block';
        destroyAllPanos();
        initAllPanosIn(popupBody);
      }, { out: 'left', in: 'right' });  // section -> chapter
    }

    function goBackToSection() {
      currentChapterIndex = null;
      destroyAllPanos();

      popupTitle.innerText = currentItem.title;
      const html = buildSectionHTML(currentItem);

      return swapContentWithSlide(html, () => {
        backBtn.style.display = 'none';
        initAllPanosIn(popupBody);
        bindChapterLinks(currentItem);
      }, { out: 'right', in: 'left' });
    }

    // ===== GSAP popup animations =====

    const popupEl = document.getElementById("popup");
    let isAnimating = false, panoViewer = null;

    function animatePopupIn() {
      if (isAnimating) return;
      isAnimating = true;
      gsap.killTweensOf(popupEl);

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const dur = reduced ? 0 : 0.35;

      gsap.set(popupEl, { display: 'flex', opacity: 0, yPercent: 6, scale: 0.98, transformOrigin: '50% 100%' });
      gsap.to(popupEl, {
        opacity: 1, yPercent: 0, scale: 1, duration: dur, ease: 'power3.out',
        onComplete: () => { isAnimating = false; }
      });
    }

    function animatePopupOut() {
      if (isAnimating) return;
      isAnimating = true;
      gsap.killTweensOf(popupEl);

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const dur = reduced ? 0 : 0.25;

      gsap.to(popupEl, {
        opacity: 0, yPercent: 6, scale: 0.98, duration: dur, ease: 'power2.in',
        onComplete: () => {
          popupEl.style.display = 'none';
          isAnimating = false;
          // Clean up viewer to free GPU + avoid multiple instances.
          if (panoViewer) { try { panoViewer.destroy(); } catch (e) { } panoViewer = null; }
        }
      });
    }

    let panoViewers = []; // keep references to destroy on close

    function initPano(el) {
      if (el._viewer) return; // already created

      const cfg = {
        type: 'equirectangular',
        panorama: el.dataset.src,
        autoLoad: true,
        showFullscreenCtrl: true,
        keyboardZoom: false
      };

      // Optional tuning from data-attrs
      if (el.dataset.yaw) cfg.yaw = parseFloat(el.dataset.yaw);
      if (el.dataset.pitch) cfg.pitch = parseFloat(el.dataset.pitch);
      if (el.dataset.hfov) cfg.hfov = parseFloat(el.dataset.hfov);
      if (el.dataset.autorotate) cfg.autoRotate = parseFloat(el.dataset.autorotate);

      const v = pannellum.viewer(el, cfg);
      el._viewer = v;
      panoViewers.push(v);

      // Make sure it sizes correctly after details open/animation
      setTimeout(() => { try { v.resize(); } catch (_) { } }, 50);
    }

    function initAllPanosIn(container) {
      // For panos inside <details>, init on first open; for visible panos, init immediately.
      container.querySelectorAll('.pano').forEach(el => {
        const d = el.closest('details');
        if (d) {
          const onToggle = () => {
            if (d.open) initPano(el);
          };
          // If already open, init now; otherwise init when opened the first time
          d.open ? initPano(el) : d.addEventListener('toggle', onToggle, { once: true });
        } else {
          initPano(el);
        }
      });
    }

    function destroyAllPanos() {
      panoViewers.forEach(v => { try { v.destroy(); } catch (_) { } });
      panoViewers = [];
      // also clear element refs
      document.querySelectorAll('#popup-body .pano').forEach(el => { el._viewer = null; });
    }

    function showPopup(item) {
      currentItem = item;
      currentChapterIndex = null;

      // Title and initial SECTION view
      popupTitle.innerText = item.title;
      popupBody.innerHTML = buildSectionHTML(item);
      popupBody.scrollTop = 0;
      popupBody.parentElement.scrollTop = 0;

      // Section starts visible (no slide swap for first render)
      backBtn.style.display = 'none';
      destroyAllPanos();
      initAllPanosIn(popupBody);
      bindChapterLinks(item);

      // Then animate the popup card itself (your existing GSAP in)
      animatePopupIn();
    }

    function hidePopup() {
      currentItem = null;
      currentChapterIndex = null;
      destroyAllPanos();      // free GPU/webgl contexts
      animatePopupOut();
    }

    // ==== AR Scene setup ====

    const scene = document.getElementById("sceneRoot");

    const marker = document.createElement("a-marker");
    marker.setAttribute("type", "pattern");
    marker.setAttribute("url", "data/letterA.patt");
    marker.setAttribute("id", "main-marker");

    popupData.forEach((item, idx) => {

      // Pin model
      const pin = document.createElement("a-entity");
      pin.setAttribute("position", `${item.pin_position.x} ${item.pin_position.y} ${item.pin_position.z}`);
      // pin.setAttribute("position", "0 0 0");
      pin.setAttribute("scale", "4.5 4.5 4.5");        /* uniform scale */
      pin.setAttribute("gltf-model", "#pin");
      pin.dataset.idx = idx;
      // pin.setAttribute('animation__pulse',
      //   'startEvents: pulse; property: scale; from: 7 7 7; to: 8.5 8.5 8.5; dir: alternate; dur: 120; easing: easeOutCubic; loop: 1');
      marker.appendChild(pin);

      // Test cube (should look perfectly cubic)
      // const test = document.createElement('a-box');
      // test.setAttribute('position', '0 2 0');
      // test.setAttribute('width', '1'); test.setAttribute('height', '1'); test.setAttribute('depth', '1');
      // marker.appendChild(test);

      // Label
      const label = document.createElement("a-text");
      label.setAttribute("value", item.pin_title);
      label.setAttribute("align", "center");
      label.setAttribute("color", "#FFFFFF");
      label.setAttribute("position", `${item.pin_position.x} ${item.pin_position.y + 3} ${item.pin_position.z}`);
      // label.setAttribute("position", "0 3 0");
      label.setAttribute("scale", "2.5 2.5 2.5");  /* uniform */
      label.setAttribute("side", "double");
      label.setAttribute("look-at", "[camera]");
      label.dataset.idx = idx;
      label.setAttribute('animation__lpulse',
        'startEvents: lpulse; property: scale; from: 2.5 2.5 2.5; to: 3 3 3; dir: alternate; dur: 120; easing: easeOutCubic; loop: 1');
      marker.appendChild(label);

      // Transparent hit box
      const hitBox = document.createElement("a-box");
      hitBox.setAttribute("material", {
        color: '#FFF',
        opacity: 0.3,      // keep visible for testing
        transparent: true,
        side: 'double',
        depthTest: true,   // ensure proper depth testing
        depthWrite: true   // write to depth buffer
      });
      hitBox.classList.add("clickable");
      hitBox.dataset.idx = idx;
      marker.appendChild(hitBox);

      // Click handler
      const handleClick = () => {
        pin.emit('pulse'); label.emit('lpulse');
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) { } }
        showPopup(item);
      };

      // Size hit box
      const sizeHitBox = () => {
        const THREE = window.THREE;
        const modelObj = pin.getObject3D('mesh') || pin.object3D;
        if (!modelObj || !marker.object3D) return;

        const boxWorld = new THREE.Box3().setFromObject(modelObj);
        const minLocal = boxWorld.min.clone();
        const maxLocal = boxWorld.max.clone();
        marker.object3D.worldToLocal(minLocal);
        marker.object3D.worldToLocal(maxLocal);

        const minX = Math.min(minLocal.x, maxLocal.x);
        const maxX = Math.max(minLocal.x, maxLocal.x);
        const minY = Math.min(minLocal.y, maxLocal.y);
        const maxY = Math.max(minLocal.y, maxLocal.y);
        const minZ = Math.min(minLocal.z, maxLocal.z);
        const maxZ = Math.max(minLocal.z, maxLocal.z);

        const labelPos = label.object3D.position;
        const labelScale = label.getAttribute('scale') || { x: 3, y: 3, z: 3 };
        const labelHalfH = 0.45 * labelScale.y;

        const marginY = 0.4;
        const bottomY = minY;
        const topY = Math.max(maxY, labelPos.y + labelHalfH);
        const totalH = (topY - bottomY) + marginY;

        const marginX = 0.3, marginZ = 0.3;
        const totalW = (maxX - minX) + marginX;
        const totalD = (maxZ - minZ) + marginZ;

        const centerX = (minX + maxX) / 2;
        const centerZ = (minZ + maxZ) / 2;
        const centerY = bottomY + totalH / 2;

        // Position hitbox relative to pin position
        const pinPos = pin.object3D.position;

        console.log(`Pin ${idx}: expected position:`, item.pin_position.x, item.pin_position.y, item.pin_position.z);
        console.log(`Pin ${idx}: object3D position:`, pinPos.x, pinPos.y, pinPos.z);


        hitBox.setAttribute('position', `${centerX} ${centerY} ${centerZ}`);

        // hitBox.setAttribute('position', `${pinPos.x + centerX} ${pinPos.y + centerY} ${pinPos.z + centerZ}`);
        // hitBox.setAttribute('position', `${centerX} ${centerY} ${centerZ}`);
        hitBox.setAttribute('width', totalW * 3);   // 3x wider
        hitBox.setAttribute('height', totalH * 2);  // 2x taller
        hitBox.setAttribute('depth', totalD * 3);   // 3x deeper

        console.log(`Hitbox ${idx} final position:`, centerX, centerY, centerZ);
      };

      pin.addEventListener('model-loaded', sizeHitBox);
      label.addEventListener('componentchanged', (e) => {
        const n = e.detail && e.detail.name;
        if (n === 'value' || n === 'scale' || n === 'position' || n === 'text') sizeHitBox();
      });

      hitBox.addEventListener("click", handleClick);
      pin.addEventListener("click", handleClick);
      label.addEventListener("click", handleClick);
    });

    scene.appendChild(marker);

    /* Touch/click raycasting with ripple feedback (no resize meddling) */
    scene.addEventListener('loaded', () => {
      const THREE = window.THREE;
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      const fx = document.getElementById('tapfx');
      let lastTouchTime = 0;

      function getCanvas() {
        return scene.canvas || (scene.renderer && scene.renderer.domElement);
      }

      function visibleClickableObjects() {
        const els = Array.from(document.querySelectorAll('.clickable'));
        console.log("ELS", els);
        return els
          .filter(el => {
            let m = el;
            while (m && m.tagName !== 'A-MARKER') m = m.parentEl;
            return m && m.object3D && m.object3D.visible;
          })
          .map(el => el.object3D)
          .filter(Boolean);
      }

      function getPoint(ev) {
        const t = ev.touches ? ev.touches[0] : ev.changedTouches ? ev.changedTouches[0] : ev;
        return { x: t.clientX, y: t.clientY };
      }

      function ndcFromEvent(ev, canvas) {
        const p = getPoint(ev);
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((p.x - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((p.y - rect.top) / rect.height) * 2 + 1;
        return p;
      }

      function rippleAt(x, y, isHit) {
        const el = document.createElement('div');
        el.className = `ripple ${isHit ? 'hit' : 'miss'}`;
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        fx.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
        setTimeout(() => el.remove(), 700);
      }

      function findEntityFromObject(obj) {
        let cur = obj;
        while (cur && !cur.el) cur = cur.parent;
        return cur && cur.el ? cur.el : null;
      }

      function onTap(ev) {
        const now = Date.now();
        if (ev.type === 'click' && now - lastTouchTime < 400) return;
        if (ev.type.startsWith('touch')) lastTouchTime = now;

        const canvas = getCanvas();
        if (!canvas) return;

        // Get the camera entity and its actual camera object
        const cameraEl = document.querySelector('[camera]');
        const camera = cameraEl?.components?.camera?.camera;

        if (!camera) {
          console.warn('❌ Camera not found');
          return;
        }

        const screenPt = ndcFromEvent(ev, canvas);
        raycaster.setFromCamera(mouse, camera);
        raycaster.params.Mesh.threshold = 0.5;

        const targets = visibleClickableObjects();
        console.log('🎯 Targets:', targets.length);

        const hits = raycaster.intersectObjects(targets, true);

        console.log('👆 Tap at screen:', screenPt.x, screenPt.y);
        console.log('🎯 Raycaster hits:', hits.length);
        console.log('📍 Mouse NDC:', mouse.x.toFixed(2), mouse.y.toFixed(2));
        console.log('📐 Ray origin:', raycaster.ray.origin);
        console.log('📐 Ray direction:', raycaster.ray.direction);

        // Check what's at the ray's path
        const allHits = raycaster.intersectObjects(scene.object3D.children, true);
        console.log('🔍 ALL intersections (not just clickable):', allHits.length);
        hits.forEach((hit, i) => {
          console.log(`  Hit ${i}:`, hit.object.type, 'distance:', hit.distance.toFixed(2));
        });
        // Visualize the ray

        rippleAt(screenPt.x, screenPt.y, hits.length > 0);
        if (!hits.length) return;

        const el = findEntityFromObject(hits[0].object);
        if (!el) return;

        let clickableEl = el;
        while (clickableEl && !clickableEl.dataset?.idx) clickableEl = clickableEl.parentEl;
        if (!clickableEl) return;

        const idx = clickableEl.dataset.idx;
        const data = popupData[idx];
        if (!data) return;

        const mainMarker = document.querySelector('#main-marker');
        if (mainMarker) {
          const pins = Array.from(mainMarker.children).filter(n => n.getAttribute && n.getAttribute('gltf-model'));
          const labels = Array.from(mainMarker.children).filter(n => n.tagName === 'A-TEXT');

          const pin = pins.find(p => p.dataset.idx === idx.toString());
          const label = labels.find(l => l.dataset.idx === idx.toString());

          if (pin) pin.emit('pulse');
          if (label) label.emit('lpulse');
        }
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) { } }
        showPopup(data);
      }

      const canvas = getCanvas();
      if (canvas) {
        canvas.addEventListener('touchstart', onTap, { passive: true });
        canvas.addEventListener('click', onTap);
      }
    });
  </script>
</body>

</html>
